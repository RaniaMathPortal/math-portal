<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Admin Panel | Mrs. Rania</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 900px; margin: 4rem auto; padding: 0 1.5rem; }
        .admin-header { text-align: center; margin-bottom: 2rem; }
        .admin-card { background: var(--bg-card); padding: 2.5rem; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        
        .input-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .input-row input, .input-row select { flex: 1; padding: 1rem; background: #0b0f19; border: 1px solid var(--border-color); border-radius: 10px; color: white; font-family: inherit; font-size: 1rem; outline: none; }
        .input-row input:focus, .input-row select:focus { border-color: var(--accent-primary); }
        
        .generate-btn { width: 100%; padding: 1rem; background: var(--accent-primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s; margin-bottom: 2rem; }
        .generate-btn:hover { background: #2563eb; }
        
        .student-table { width: 100%; border-collapse: collapse; text-align: left; }
        .student-table th, .student-table td { padding: 1rem; border-bottom: 1px solid var(--border-color); color: white; vertical-align: middle; }
        .student-table th { color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .code-badge { background: rgba(59, 130, 246, 0.15); color: var(--accent-primary); padding: 0.4rem 0.8rem; border-radius: 8px; font-family: monospace; font-size: 1.1rem; font-weight: bold; letter-spacing: 1px; display: inline-block; }
        
        .action-btn { padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 500; font-size: 0.85rem; transition: 0.2s; margin-right: 0.5rem; border: 1px solid transparent; }
        .copy-btn { background: transparent; border-color: var(--accent-primary); color: var(--accent-primary); }
        .copy-btn:hover { background: rgba(59, 130, 246, 0.1); }
        .reset-btn { background: transparent; border-color: #f59e0b; color: #f59e0b; }
        .reset-btn:hover { background: rgba(245, 158, 11, 0.1); }
        .delete-btn { background: transparent; border-color: #ef4444; color: #ef4444; }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.1); }

        @media (max-width: 768px) {
            .input-row { flex-direction: column; }
            .student-table { display: block; overflow-x: auto; white-space: nowrap; }
        }
    </style>
</head>
<body>

    <!-- LOGIN GATE FOR ADMIN -->
    <div id="adminGate" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center;">
        <div style="background: var(--bg-card); padding: 3rem 2rem; border-radius: 20px; border: 1px solid var(--border-color); max-width: 400px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🛡️</div>
            <h2 style="color: white; margin-bottom: 0.5rem;">Admin Access</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">Enter the Teacher Password to manage students.</p>
            
            <form onsubmit="event.preventDefault(); checkAdminPassword();">
                <input type="password" id="adminPasswordInput" placeholder="Teacher Password" style="width: 100%; padding: 1rem; background: #0b0f19; border: 1px solid var(--border-color); border-radius: 10px; color: white; font-family: inherit; font-size: 1rem; margin-bottom: 1rem; text-align: center;">
                <button type="submit" style="width: 100%; padding: 1rem; background: var(--accent-primary); color: white; border: none; border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s;">Unlock Admin</button>
            </form>
            <p id="adminError" style="color: #ef4444; margin-top: 1rem; font-size: 0.85rem; display: none;">Incorrect Password.</p>
        </div>
    </div>

    <nav class="navbar" style="display: none;" id="adminNavbar">
        <a href="index.html" class="back-btn">← Back to Portal</a>
        <div class="nav-title">Teacher Admin Panel</div>
        <button onclick="logoutAdmin()" class="logout-btn">Logout</button>
    </nav>

    <div class="admin-container" id="adminContent" style="display: none;">
        <header class="admin-header">
            <h1 style="color: white; font-size: 2.2rem;">Student Management</h1>
            <p style="color: var(--text-secondary);">Generate codes, reset devices, or revoke access.</p>
        </header>

        <div class="admin-card">
            <!-- Generator Form -->
            <div class="input-row">
                <input type="text" id="studentName" placeholder="Student Full Name (e.g., أحمد يوسف)">
                <select id="studentGrade">
                    <option value="5">Grade 5</option>
                    <option value="6">Grade 6</option>
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                </select>
            </div>
            <button class="generate-btn" onclick="generateCode()">🚀 Generate Smart Code</button>

            <!-- Students List -->
            <table class="student-table">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Grade</th>
                        <th>Access Code</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-secondary); padding: 2rem;">Loading students...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAE6tzeY9dmC1l30z05SBJ7KgN5k_ZwRIqs",
            authDomain: "rania-math-portal.firebaseapp.com",
            projectId: "rania-math-portal",
            storageBucket: "rania-math-portal.firebasestorage.app",
            messagingSenderId: "469116190094",
            appId: "1:469116190094:web:4d8d31c9db5eb2c02db8df"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- Admin Authentication ---
        const ADMIN_PASSWORD = "RaniaAdmin2026";
        
        window.checkAdminPassword = function() {
            const input = document.getElementById('adminPasswordInput').value;
            if (input === ADMIN_PASSWORD) {
                sessionStorage.setItem("adminAuth", "true");
                showAdminPanel();
            } else {
                document.getElementById('adminError').style.display = 'block';
                document.getElementById('adminPasswordInput').value = '';
            }
        };

        window.logoutAdmin = function() {
            sessionStorage.removeItem("adminAuth");
            window.location.reload();
        };

        function showAdminPanel() {
            document.getElementById('adminGate').style.display = 'none';
            document.getElementById('adminNavbar').style.display = 'flex';
            document.getElementById('adminContent').style.display = 'block';
            loadStudents();
        }

        // Check if already logged in
        if (sessionStorage.getItem("adminAuth") === "true") {
            showAdminPanel();
        }

        // --- Generate Code Logic ---
        window.generateCode = async function() {
            const nameInput = document.getElementById('studentName');
            const gradeInput = document.getElementById('studentGrade');
            const name = nameInput.value.trim();
            const grade = gradeInput.value;

            if (!name) return alert("Please enter a student name.");

            // Random 3-digit number (100-999)
            const randomNum = Math.floor(100 + Math.random() * 900); 
            const code = `RANIA-G${grade}-${randomNum}`;

            try {
                await setDoc(doc(db, "students", code), {
                    name: name,
                    grade: grade,
                    code: code,
                    deviceId: null, // For device lock
                    createdAt: new Date().toISOString()
                });

                nameInput.value = ''; // Clear input
                loadStudents(); // Refresh table
                alert(`✅ Code generated: ${code}`);
            } catch (error) {
                console.error("Error generating code:", error);
                alert("❌ Failed to generate code.");
            }
        };

        // --- Table Actions ---
        window.copyCode = function(code) {
            navigator.clipboard.writeText(code);
            alert("📋 Code copied to clipboard!");
        };

        window.resetDevice = async function(code) {
            if (!confirm("Are you sure you want to reset the device lock for this student? They will be able to log in on a new phone.")) return;
            try {
                const studentRef = doc(db, "students", code);
                await updateDoc(studentRef, { deviceId: null });
                alert("✅ Device lock reset successfully!");
            } catch (error) {
                console.error("Error resetting device:", error);
                alert("❌ Failed to reset device.");
            }
        };

        window.deleteStudent = async function(code) {
            if (!confirm("Are you sure you want to REVOKE this student's access? They will be locked out immediately.")) return;
            try {
                await deleteDoc(doc(db, "students", code));
                loadStudents(); // Refresh table
                alert("🗑️ Student access revoked.");
            } catch (error) {
                console.error("Error deleting student:", error);
                alert("❌ Failed to delete student.");
            }
        };

        // --- Load Students ---
        async function loadStudents() {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-secondary); padding: 2rem;">Loading...</td></tr>';

            try {
                const querySnapshot = await getDocs(collection(db, "students"));
                tbody.innerHTML = '';
                
                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-secondary); padding: 2rem;">No students added yet.</td></tr>';
                    return;
                }

                // Sort by grade, then name
                const students = [];
                querySnapshot.forEach((doc) => students.push(doc.data()));
                students.sort((a, b) => a.grade - b.grade || a.name.localeCompare(b.name, 'ar'));

                students.forEach((student) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 600;">${student.name}</td>
                        <td>Grade ${student.grade}</td>
                        <td><span class="code-badge">${student.code}</span></td>
                        <td>
                            <button class="action-btn copy-btn" onclick="copyCode('${student.code}')">Copy</button>
                            <button class="action-btn reset-btn" onclick="resetDevice('${student.code}')">Reset Device</button>
                            <button class="action-btn delete-btn" onclick="deleteStudent('${student.code}')">Revoke</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error loading students:", error);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ef4444; padding: 2rem;">Error loading students.</td></tr>';
            }
        }
    </script>
</body>
</html>
